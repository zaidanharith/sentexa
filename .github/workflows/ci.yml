name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt

      - name: Verify project structure
        run: |
          echo "Checking requirements files..."
          test -f requirements/base.txt && echo "✓ base.txt found"
          test -f requirements/training.txt && echo "✓ training.txt found"
          test -f requirements/production.txt && echo "✓ production.txt found"

          echo "Checking ML module structure..."
          test -d ml/model && echo "✓ ml/model directory found"
          test -d ml/reports && echo "✓ ml/reports directory found"
          test -d ml/reports/plots && echo "✓ ml/reports/plots directory found"
          test -d ml/reports/metrics && echo "✓ ml/reports/metrics directory found"

      - name: Check Python syntax
        run: |
          python -m py_compile app/main.py
          python -m py_compile ml/model/config.py
          python -m py_compile ml/model/train.py
          python -m py_compile ml/model/evaluate.py

      - name: Run tests
        run: |
          if [ -d app/tests ] && [ -n "$(ls -A app/tests)" ]; then
            pytest app/tests -v
          else
            echo "No tests found, skipping"
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment files
        run: |
          # Backend env
          cp backend/.env.example backend/.env 2>/dev/null || \
            echo -e "DATABASE_URL=postgresql://user:pass@localhost:5432/db\nSECRET_KEY=ci-secret\nENVIRONMENT=production" > backend/.env

          # Frontend env (needed for docker compose validation)
          cp frontend/.env.example frontend/.env 2>/dev/null || \
            echo -e "NEXTAUTH_URL=http://localhost\nNEXTAUTH_SECRET=ci-dev-secret-min-32-chars-for-testing\nAUTH_SECRET=ci-dev-secret-min-32-chars-for-testing\nNEXT_PUBLIC_API_URL=http://localhost:8000/api\nGOOGLE_CLIENT_ID=\nGOOGLE_CLIENT_SECRET=" > frontend/.env
