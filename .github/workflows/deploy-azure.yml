name: Deploy Backend to Azure

on:
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - ".github/workflows/deploy-azure.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  ci-checks:
    name: Run CI Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements/base.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt

      - name: Check Python Syntax
        working-directory: backend
        run: python -m compileall .

  deploy-to-azure:
    name: Build & Deploy to Azure
    runs-on: ubuntu-latest
    needs: ci-checks

    env:
      RESOURCE_GROUP: Sentexa-RG
      CONTAINER_APP_NAME: sentexa-api
      LOCATION: eastus
      ACR_NAME: sentexaregistry
      ACR_LOGIN_SERVER: sentexaregistry.azurecr.io
      IMAGE_NAME: sentexa-backend
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_LOGIN_SERVER }}
          username: sentexaregistry
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: |
            PRE_DOWNLOAD_MODEL=true
            HF_MODEL=${{ secrets.HF_MODEL || 'zaidanharith/sentexa-indobert' }}
            HF_TOKEN=${{ secrets.HF_TOKEN }}

      - name: Deploy Azure Infrastructure
        uses: azure/arm-deploy@v2
        with:
          failOnStdErr: false
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: ./backend/deploy.bicep
          parameters: >
            location=${{ env.LOCATION }}
            allowedOrigins="https://sentexa.vercel.app,http://localhost:3000"
            hfModel="${{ secrets.HF_MODEL || 'zaidanharith/sentexa-indobert' }}"
            containerImage=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Set Container App Secrets
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp secret set \
              --name $CONTAINER_APP_NAME \
              --resource-group $RESOURCE_GROUP \
              --secrets \
                database-url="${{ secrets.DATABASE_URL }}" \
                secret-key="${{ secrets.SECRET_KEY }}" \
                kaggle-username="${{ secrets.KAGGLE_USERNAME }}" \
                kaggle-key="${{ secrets.KAGGLE_KEY }}" \
                hf-token="${{ secrets.HF_TOKEN }}"

      - name: Update Container App Image
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name $CONTAINER_APP_NAME \
              --resource-group $RESOURCE_GROUP \
              --image $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG
