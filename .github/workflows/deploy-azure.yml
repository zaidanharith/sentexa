name: Deploy Backend to Azure

on:
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - ".github/workflows/deploy-azure.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  ci-checks:
    name: Run CI Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
      - name: Check Python Syntax (Recursive)
        run: python -m compileall .

  deploy-to-azure:
    name: Build & Deploy to Azure
    runs-on: ubuntu-latest
    needs: ci-checks
    env:
      RESOURCE_GROUP: Sentexa-RG
      CONTAINER_APP_NAME: sentexa-api
      LOCATION: eastus

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Azure Infrastructure (Bicep)
        uses: azure/arm-deploy@v2
        id: bicep-deploy
        with:
          failOnStdErr: false
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: ./backend/deploy.bicep
          parameters: >
            location=${{ env.LOCATION }}
            allowedOrigins="https://sentexa.vercel.app,http://localhost:3000"
            hfModel="${{ secrets.HF_MODEL || 'zaidanharith/sentexa-indobert' }}"
            containerImage=${{ secrets.ACR_LOGIN_SERVER || 'sentexaregistry.azurecr.io/sentexa-backend:latest' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: image=moby/buildkit:latest

      - name: Create and use Buildx builder
        run: |
          docker buildx create --name builder-with-cache --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: sentexaregistry.azurecr.io
          username: sentexaregistry
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: sentexaregistry.azurecr.io/sentexa-backend:latest
          build-args: |
            PRE_DOWNLOAD_MODEL=true
            HF_MODEL=${{ secrets.HF_MODEL || 'zaidanharith/sentexa-indobert' }}
            HF_TOKEN=${{ secrets.HF_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Securely Set Secrets & Deploy
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            echo "[+] Injecting secrets..."
            az containerapp secret set \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --secrets database-url=${{ secrets.DATABASE_URL }} \
                        secret-key=${{ secrets.SECRET_KEY }} \
                        kaggle-username=${{ secrets.KAGGLE_USERNAME }} \
                        kaggle-key=${{ secrets.KAGGLE_KEY }} \
                        hf-token=${{ secrets.HF_TOKEN }}
                                 
            echo "[+] Updating image..."
            az containerapp update \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image sentexaregistry.azurecr.io/sentexa-backend:latest
