name: Deploy Backend to Azure

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  ci-checks:
    name: Run CI Checks
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -r requirements/production.txt

      - name: Check Python Syntax
        run: |
          python -m py_compile app/main.py
          python -m py_compile ml/model/config.py
          python -m py_compile ml/inference/predict.py

  deploy-to-azure:
    name: Build & Deploy to Azure
    runs-on: ubuntu-latest
    needs: ci-checks

    env:
      RESOURCE_GROUP: rg-sentexa-prod
      LOCATION: southeastasia
      CONTAINER_APP_NAME: ca-sentexa-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Azure Infrastructure (Bicep)
        uses: azure/arm-deploy@v2
        id: bicep-deploy
        with:
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: ./backend/deploy.bicep
          parameters: >
            location=${{ env.LOCATION }}
            allowedOrigins="https://sentexa.vercel.app,http://localhost:3000"
            hfModel="${{ secrets.HF_MODEL || 'zaidanharith/sentexa-indobert' }}"
          failOnStdErr: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry (ACR)
        uses: azure/docker-login@v1
        with:
          login-server: ${{ steps.bicep-deploy.outputs.acrLoginServer }}
          username: ${{ steps.bicep-deploy.outputs.acrAdminUsername }}
          password: ${{ secrets.AZURE_ACR_PASSWORD || steps.bicep-deploy.outputs.acrPassword }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.bicep-deploy.outputs.acrLoginServer }}/sentexa-backend:latest
          build-args: |
            PRE_DOWNLOAD_MODEL=true
            HF_MODEL=${{ secrets.HF_MODEL || 'zaidanharith/sentexa-indobert' }}
            HF_TOKEN=${{ secrets.HF_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Securely Set Container App Secrets & Deploy
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            echo "[+] Injecting actual secrets to Container App..."
            az containerapp secret set \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --secrets \
                "database-url=${{ secrets.DATABASE_URL }}" \
                "secret-key=${{ secrets.SECRET_KEY }}" \
                "kaggle-username=${{ secrets.KAGGLE_USERNAME }}" \
                "kaggle-key=${{ secrets.KAGGLE_KEY }}" \
                "hf-token=${{ secrets.HF_TOKEN }}"
                
            echo "[+] Deploying latest image revision..."
            az containerapp update \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ steps.bicep-deploy.outputs.acrLoginServer }}/sentexa-backend:latest
