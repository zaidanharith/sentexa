services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentexa_backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}

    ports:
      - "8000:8000"

    networks:
      - sentexa_network

    volumes:
      - ./backend/app:/app/app
      - ./backend/ml/model/checkpoint:/app/ml/model/checkpoint
      - hf_cache:/root/.cache/huggingface

    security_opt:
      - no-new-privileges:true

    develop:
      watch:
        - action: sync
          path: ./backend/app
          target: /app/app
          ignore:
            - __pycache__/
            - "*.pyc"
            - .pytest_cache/
            - .ruff_cache/

        - action: sync
          path: ./backend/ml/model/checkpoint
          target: /app/ml/model/checkpoint

        - action: rebuild
          path: ./backend/requirements/production.txt

        - action: rebuild
          path: ./backend/requirements/base.txt

        - action: rebuild
          path: ./backend/Dockerfile

        - action: rebuild
          path: ./backend/alembic.ini

  nginx:
    image: nginx:alpine
    container_name: sentexa_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - sentexa_network
    read_only: true
    tmpfs:
      - /var/run
      - /var/cache/nginx
      - /tmp
    develop:
      watch:
        - action: sync
          path: ./nginx
          target: /etc/nginx

networks:
  sentexa_network:
    driver: bridge

volumes:
  hf_cache:
