services:
  backend:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile
    container_name: sentexa_backend
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "8000:8000"
    networks:
      - sentexa_network
    volumes:
      - ../../app/nlp/data/raw:/app/app/nlp/data/raw:ro
      - ../../app/nlp/data/processed:/app/app/nlp/data/processed
    security_opt:
      - no-new-privileges:true
    develop:
      watch:
        - action: sync
          path: ../../app
          target: /app/app
          ignore:
            - __pycache__/
            - "*.pyc"
            - .pytest_cache/
            - .ruff_cache/
        - action: rebuild
          path: ../../requirements.txt
        - action: rebuild
          path: ../../alembic.ini

  nginx:
    image: nginx:alpine
    container_name: sentexa_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - sentexa_network
    read_only: true
    tmpfs:
      - /var/run
      - /var/cache/nginx
      - /tmp
    develop:
      watch:
        - action: sync
          path: ./nginx
          target: /etc/nginx

networks:
  sentexa_network:
    driver: bridge
